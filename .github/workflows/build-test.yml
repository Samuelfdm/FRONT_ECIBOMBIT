name: Build and Push - Frontend EciBombit

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ job.status }}
      acr_login_token: ${{ steps.acr_login.outputs.acr_access_token }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build for production (Nginx)
        run: |
          npm run build

      - name: Login to Azure Container Registry
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR and get token
        id: acr_login
        uses: azure/cli@v1
        with:
          az_cli_version: "2.72.0"
          inlineScript: |
            ACCESS_TOKEN=$(az acr login --name ${{ secrets.ACR_NAME }} --expose-token --query accessToken -o tsv)
            echo "::set-output name=acr_access_token::$ACCESS_TOKEN"

      - name: Build and push Docker image (Nginx)
        run: |
          docker login ${{ secrets.ACR_NAME }}.azurecr.io -u 00000000-0000-0000-0000-000000000000 -p ${{ steps.acr_login.outputs.acr_access_token }}
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/front-client:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/front-client:latest

